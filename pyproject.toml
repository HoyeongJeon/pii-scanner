[project]
name = "pii-scanner"
version = "0.1.0"
description = "개인정보(PII) 노출 탐지 스캐너"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Natural Language :: Korean",
    "Topic :: Security",
]
dependencies = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pdfminer.six>=20231228",
    "Jinja2>=3.1.0",
]

[project.optional-dependencies]
hwp = ["pyhwp>=0.1b15"]   # .hwp 바이너리 지원 (선택적·지연 import)
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
pii-scan = "pii_scanner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # editable 설치 없이도 pii_scanner/examples import 가능
